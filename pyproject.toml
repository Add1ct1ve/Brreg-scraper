[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brreg-scraper"
version = "0.1.0"
description = "Kraftig scraper for Bronnøysundregistrene - hent data om alle norske organisasjoner"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Haakon" }
]
keywords = ["brreg", "bronnøysund", "enhetsregisteret", "scraper", "norway", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
]

[project.scripts]
brreg = "brreg_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/brreg_scraper"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
